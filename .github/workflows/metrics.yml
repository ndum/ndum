name: Metrics
on:
  # Regenerate daily at 00:00 UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow manual runs from the Actions tab → "Run workflow"
  workflow_dispatch:
  # Run on every push to main
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ndum
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Top languages plugin (replaces the old top-langs card)
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_limit: 10
          
          # Optional extras
          plugin_isocalendar: yes
          plugin_followup: yes
          
          # Locale & timezone
          config_timezone: Europe/Zurich
