name: Metrics
on:
  # Täglich um 00:00 UTC neu generieren
  schedule: [{cron: "0 0 * * *"}]
  # Manuell ausführbar (Actions-Tab → "Run workflow")
  workflow_dispatch:
  # Bei jedem Push auf main
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ndum
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Top Languages Plugin (ersetzt deine alte Top-Langs-Card)
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_limit: 10
          
          # Optional: schöne Extras
          plugin_isocalendar: yes
          plugin_followup: yes
          
          # Sprache & Zeitzone
          config_timezone: Europe/Zurich
